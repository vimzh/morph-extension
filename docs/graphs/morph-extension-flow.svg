<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="10d4b3c36cd18d921cd1d05c8498ea75519dcad40d1dffc547f5e208befb968f">
  <title id="title">From request to browser feature</title>
  <desc id="description">The Morph product flow from user request and browser context through agentic coding, validation, installation, and iterative refinement.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#57534e"/></marker>
    <style>
      text { font-family: "Comic Sans MS", "Segoe Print", cursive; }
      .title { font-size: 36px; fill: #292524; }
      .subtitle { font-size: 17px; fill: #78716c; }
      .zone-label { font-size: 14px; letter-spacing: 1px; }
      .node-title { font-size: 20px; fill: #292524; }
      .node-body { font-size: 15px; fill: #44403c; }
      .node-note { font-size: 13px; fill: #57534e; }
      .edge-label { font-size: 13px; fill: #57534e; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
      .footer { font-size: 13px; fill: #57534e; }
      .arrow { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="54" y="62" class="title">From request to browser feature</text>
  <text x="54" y="94" class="subtitle">Morph turns a plain-language browser task into a validated, installable extension</text>
  <rect data-zone-id="input" x="42.0" y="130" width="411.3" height="690" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="62.0" y="160" class="zone-label" fill="#1e40af">1 · WHAT ENTERS</text>
  <rect data-zone-id="transform" x="481.3" y="130" width="555.2" height="690" rx="28" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="501.3" y="160" class="zone-label" fill="#5b21b6">2 · WHAT MORPH BUILDS</text>
  <rect data-zone-id="outcome" x="1064.5" y="130" width="493.5" height="690" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1084.5" y="160" class="zone-label" fill="#166534">3 · WHAT BECOMES USEFUL</text>
  <path class="arrow" data-edge="request--context" d="M247.6 326.0 V330.5" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="arrow" data-edge="context--agent" d="M423.3 408.0 H467.3 V258.0 H511.3" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="agent--workspace" d="M758.9 326.0 V352.0" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="workspace--validate" d="M758.9 464.0 V490.0" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <path class="arrow" data-edge="validate--install" d="M1006.5 558.0 H1050.5 V258.0 H1094.5" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="install--refine" d="M1311.2 326.0 V340.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="refine--agent" d="M1528.0 408.0 H1546.0 V806.0 H493.3 V258.0 H511.3" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <rect class="node" data-node-id="request" data-status="external" x="72.0" y="190.0" width="351.3" height="136.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="247.6" y="225.0" text-anchor="middle" class="node-title">Describe a browser task</text>
  <text x="247.6" y="256.0" text-anchor="middle" class="node-body">plain-language request</text>
  <text x="247.6" y="278.0" text-anchor="middle" class="node-body">new project workspace</text>
  <text x="247.6" y="308.0" text-anchor="middle" class="node-note">The user chooses the behavior</text>
  <rect class="node" data-node-id="context" data-status="implemented" x="72.0" y="330.5" width="351.3" height="155.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="247.6" y="365.5" text-anchor="middle" class="node-title">Bring in the current page</text>
  <text x="247.6" y="396.5" text-anchor="middle" class="node-body">open-tab metadata</text>
  <text x="247.6" y="418.5" text-anchor="middle" class="node-body">page content and console logs</text>
  <text x="247.6" y="448.5" text-anchor="middle" class="node-note">Only requested browser context crosses the</text>
  <text x="247.6" y="467.5" text-anchor="middle" class="node-note">boundary</text>
  <rect class="node" data-node-id="agent" data-status="implemented" x="511.3" y="190.0" width="495.2" height="136.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="758.9" y="225.0" text-anchor="middle" class="node-title">The coding agent plans and writes</text>
  <text x="758.9" y="256.0" text-anchor="middle" class="node-body">inspect → search → create → edit</text>
  <text x="758.9" y="278.0" text-anchor="middle" class="node-body">Manifest V3 extension files</text>
  <text x="758.9" y="308.0" text-anchor="middle" class="node-note">The tool loop observes results before continuing</text>
  <rect class="node" data-node-id="workspace" data-status="implemented" x="511.3" y="352.0" width="495.2" height="112.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="758.9" y="387.0" text-anchor="middle" class="node-title">A real project takes shape</text>
  <text x="758.9" y="418.0" text-anchor="middle" class="node-body">files persist in the project workspace</text>
  <text x="758.9" y="440.0" text-anchor="middle" class="node-body">conversation history stays available</text>
  <rect class="node" data-node-id="validate" data-status="implemented" x="511.3" y="490.0" width="495.2" height="136.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="758.9" y="525.0" text-anchor="middle" class="node-title">Validate before handing it over</text>
  <text x="758.9" y="556.0" text-anchor="middle" class="node-body">manifest and file references</text>
  <text x="758.9" y="578.0" text-anchor="middle" class="node-body">JavaScript syntax and MV3 checks</text>
  <text x="758.9" y="608.0" text-anchor="middle" class="node-note">Broken extensions stop here instead of being presented as ready</text>
  <rect class="node" data-node-id="install" data-status="implemented" x="1094.5" y="190.0" width="433.5" height="136.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1311.2" y="225.0" text-anchor="middle" class="node-title">Load the extension in Chrome</text>
  <text x="1311.2" y="256.0" text-anchor="middle" class="node-body">build the generated workspace</text>
  <text x="1311.2" y="278.0" text-anchor="middle" class="node-body">show an install handoff</text>
  <text x="1311.2" y="308.0" text-anchor="middle" class="node-note">The user can inspect and load ordinary extension files</text>
  <rect class="node" data-node-id="refine" data-status="implemented" x="1094.5" y="340.0" width="433.5" height="136.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1311.2" y="375.0" text-anchor="middle" class="node-title">Request the next focused change</text>
  <text x="1311.2" y="406.0" text-anchor="middle" class="node-body">observe the browser result</text>
  <text x="1311.2" y="428.0" text-anchor="middle" class="node-body">refine the same project</text>
  <text x="1311.2" y="458.0" text-anchor="middle" class="node-note">The loop continues until the behavior is useful</text>
  <rect x="54" y="844" width="1492" height="36" rx="14" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="800" y="868" text-anchor="middle" class="footer">Generate, validate, load, observe, and refine.</text>
</svg>
